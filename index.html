<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#2a0a1f; --bg2:#5c1236; --ink:#fff1f4; --glow:#ff4d79; --soft:#ffb3c6; --muted:#e9b8c6;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg1:#ffe3ea; --bg2:#ffc2d1; --ink:#7a0f3a; --glow:#e0194f; --soft:#ff7a9c; --muted:#8a3556;
  }
}
:root[data-theme="light"]{--bg1:#ffe3ea;--bg2:#ffc2d1;--ink:#7a0f3a;--glow:#e0194f;--soft:#ff7a9c;--muted:#8a3556}
:root[data-theme="dark"]{--bg1:#2a0a1f;--bg2:#5c1236;--ink:#fff1f4;--glow:#ff4d79;--soft:#ffb3c6;--muted:#e9b8c6}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg1) 75%);
  color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  overflow:hidden;display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.heart{
  position:absolute;bottom:-10vh;line-height:1;will-change:transform,opacity;
  animation:rise var(--d) linear forwards;
  color:var(--c);opacity:0;
}
@keyframes rise{
  0%{transform:translate3d(0,0,0) scale(.6) rotate(-8deg);opacity:0}
  10%{opacity:var(--o)}
  50%{transform:translate3d(var(--x),-60vh,0) scale(1) rotate(8deg)}
  100%{transform:translate3d(calc(var(--x) * -1),-125vh,0) scale(1.15) rotate(-6deg);opacity:0}
}
.burst{
  position:fixed;pointer-events:none;line-height:1;color:var(--c);
  animation:burst .9s ease-out forwards;
}
@keyframes burst{
  to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}
}
main{
  position:relative;z-index:1;width:min(92vw,820px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(.8rem,3vh,1.6rem);text-align:center;
}
.big{
  width:clamp(56px,14vw,110px);aspect-ratio:1;
  animation:beat 1.3s ease-in-out infinite;
  filter:drop-shadow(0 0 18px var(--glow));
}
.big path{fill:var(--glow)}
@keyframes beat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.18)}
  28%{transform:scale(1)}
  42%{transform:scale(1.12)}
  70%{transform:scale(1)}
}
.write{width:100%;height:auto;overflow:visible}
.write text{
  font-family:"Great Vibes","Brush Script MT",cursive;font-size:150px;
  text-anchor:middle;fill:transparent;stroke:var(--ink);stroke-width:1.6;
  stroke-dasharray:900;stroke-dashoffset:900;
  animation:draw 3.2s ease-out .4s forwards, fill 1.2s ease 3s forwards, glow 2.6s ease-in-out 4.2s infinite;
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill:var(--ink);stroke-width:0}}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 4px var(--glow))}
  50%{filter:drop-shadow(0 0 22px var(--glow))}
}
.sub{
  margin:0;font-size:clamp(1rem,3.4vw,1.35rem);color:var(--muted);
  opacity:0;animation:fade 1.4s ease 4s forwards;min-height:1.6em;
}
@keyframes fade{to{opacity:1}}
button{
  font:600 1rem "Nunito",system-ui,sans-serif;color:var(--ink);cursor:pointer;
  background:transparent;border:1.5px solid var(--soft);border-radius:999px;
  padding:.7rem 1.5rem;opacity:0;animation:fade 1s ease 4.6s forwards;
  transition:background .25s,transform .25s;
}
button:hover{background:color-mix(in srgb,var(--glow) 30%,transparent);transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--soft);outline-offset:3px}
@media (prefers-reduced-motion: reduce){
  .heart{display:none}
  .big{animation:none}
  .write text{animation:none;fill:var(--ink);stroke-width:0;stroke-dashoffset:0}
  .sub,button{animation:none;opacity:1}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<main>
  <svg class="big" viewBox="0 0 32 29" aria-hidden="true">
    <path d="M23.6 0c-3 0-5.3 1.5-7.6 4.2C13.700 1.500 11.400 0 8.400 0 3.700 0 0 3.700 0 8.400c0 8.200 9.700 14.200 14.600 19.700.7.800 2.100.800 2.800 0C22.300 22.600 32 16.600 32 8.400 32 3.700 28.300 0 23.600 0z"/>
  </svg>

  <svg class="write" viewBox="0 0 800 220" role="img" aria-label="I love you">
    <text id="word" x="400" y="165">I love you</text>
  </svg>

  <p class="sub" id="sub">Toque na tela para espalhar corações</p>
  <button id="lang" type="button">Eu te amo</button>
</main>

<script>
(function(){
  var sky=document.getElementById('sky');
  var word=document.getElementById('word');
  var sub=document.getElementById('sub');
  var btn=document.getElementById('lang');
  var colors=['#ff4d79','#ff85a1','#ffb3c6','#ff2e63','#f9a8d4','#fb7185'];
  var shapes=['❤','♥','💖','💗'];
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pt=false;

  function rand(a,b){return a+Math.random()*(b-a)}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}

  function spawn(){
    if(reduce||document.hidden)return;
    var h=document.createElement('span');
    h.className='heart';
    h.textContent=pick(shapes);
    h.style.left=rand(0,100)+'vw';
    h.style.fontSize=rand(14,44)+'px';
    h.style.setProperty('--d',rand(6,12)+'s');
    h.style.setProperty('--x',rand(-12,12)+'vw');
    h.style.setProperty('--o',rand(.35,.9).toFixed(2));
    h.style.setProperty('--c',pick(colors));
    sky.appendChild(h);
    h.addEventListener('animationend',function(){h.remove()});
  }
  setInterval(spawn,420);
  for(var i=0;i<8;i++)setTimeout(spawn,i*180);

  function burst(x,y){
    if(reduce)return;
    for(var i=0;i<14;i++){
      var b=document.createElement('span');
      var a=rand(0,Math.PI*2),r=rand(50,140);
      b.className='burst';
      b.textContent=pick(shapes);
      b.style.left=x+'px';b.style.top=y+'px';
      b.style.fontSize=rand(14,30)+'px';
      b.style.setProperty('--c',pick(colors));
      b.style.setProperty('--dx',Math.cos(a)*r+'px');
      b.style.setProperty('--dy',Math.sin(a)*r+'px');
      b.style.setProperty('--r',rand(-40,40)+'deg');
      document.body.appendChild(b);
      b.addEventListener('animationend',function(){this.remove()});
    }
  }
  document.addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY)});

  btn.addEventListener('click',function(e){
    e.stopPropagation();
    pt=!pt;
    word.textContent=pt?'Eu te amo':'I love you';
    btn.textContent=pt?'I love you':'Eu te amo';
    sub.textContent=pt?'Esse é um presentinho simples para meu momo minha vida e minha razão de viver , eu te amo muito meu amor ,agr você está no trabalho, qnd der p vc ver , espero que goste ,uma fração do meu amor por vcc':'Esse é um presentinho simples para meu momo minha vida e minha razão de viver , eu te amo muito meu amor ,agr você está no trabalho, qnd der p vc ver , espero que goste, uma fração do meu amor por vc ';
    document.querySelector('.write').setAttribute('aria-label',word.textContent);
    var r=btn.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2);
  });
})();
</script>
</body>
</html>
